<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Export — Opção Clean</title>
<link rel="stylesheet" href="./poster.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--cj-black); }
  .stage {
    width: 1080px;
    max-width: none;
    aspect-ratio: auto;
    height: 1920px;
    margin: 0;
    box-shadow: none;
  }
  .hero { font-size: 168px; }
  .logo { width: 320px; height: auto; }
  .crest { width: 140px; height: auto; opacity: 0.95; }
  .p-top { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .p-hero-block { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 27px; }
  .p-scripture-block { margin-top: 47px; display: flex; flex-direction: column; align-items: center; gap: 11px; }
  .p-footer { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 15px; }
  .content { padding: 72px 72px 60px; }
  .eyebrow { font-size: 26px; }
  .hero { line-height: 0.95; }
  .rule { height: 2px; width: 96px; }
  .scripture { font-size: 34px; }
  .scripture-ref { font-size: 22px; }
  .footer-text { font-size: 22px; }
  .footer-name { font-size: 24px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="artboard">
      <div class="glow"></div>
      <div class="content">

        <div class="p-top">
          <img class="logo" src="../public/LogoCentralJovem.svg" alt="Central Jovem" />
          <p class="eyebrow">Culto de Jovens · 16/08 · 18h</p>
        </div>

        <div class="p-hero-block">
          <h1 class="hero">Constantes</h1>
          <div class="rule"></div>
        </div>

        <div class="p-scripture-block">
          <p class="scripture">&ldquo;Sede firmes e constantes, sempre abundantes na obra do Senhor.&rdquo;</p>
          <p class="scripture-ref">1 Coríntios 15:58</p>
        </div>

        <div class="p-footer">
          <img class="crest" src="../public/logoIBCI.png" alt="" aria-hidden="true" />
          <p class="footer-name">Igreja Batista Central em Itambi</p>
          <p class="footer-text">Rua 10, próx. ao CIEP 451, Itambi<br />Seminarista Renan Farias</p>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
